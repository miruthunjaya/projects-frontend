<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Valentine's Day Card</title>
    <meta name="author" content="Miruthunjaya Selvan">
    <link rel="stylesheet" href="styles.css">
    <style>
        #final .message, #rejected .message {
            font-size: 2.2rem; 
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3); 
        }
        .name-input-container {
            margin-bottom: 0.5rem;
            
        }
        .name-input {
            padding: 0.75rem;
            border: 0.5px solid #ccc;
            border-radius: 5px;
            font-size: 1.2rem;
            font-family: 'Times New Roman', serif !important;
            text-align: center;
            width: 80%; 
        }
        .name-input:focus {
            outline: 3px solid #ff4b6e; 
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="heart-container">
            <svg class="main-heart" viewBox="0 0 100 100" width="100" height="100">
                <path class="heart-path" d="M50 88.9L16.7 55.6C7.2 46.1 7.2 30.9 16.7 21.4s24.7-9.5 34.2 0L50 20.5l-0.9 0.9c9.5-9.5 24.7-9.5 34.2 0s9.5 24.7 0 34.2L50 88.9z"/>
            </svg>
            <svg class="broken-heart" viewBox="0 0 100 100" width="100" height="100">
                <path d="M50 88.9L16.7 55.6C7.2 46.1 7.2 30.9 16.7 21.4s24.7-9.5 34.2 0L50 20.5l-0.9 0.9c9.5-9.5 24.7-9.5 34.2 0s9.5 24.7 0 34.2L50 88.9z"/>
                <path d="M50 88.9L83.3 55.6c9.5-9.5 9.5-24.7 0-34.2s-24.7-9.5-34.2 0L50 20.5l0.9 0.9c-9.5-9.5-24.7-9.5-34.2 0s-9.5 24.7 0 34.2L50 88.9z"/>
            </svg>
        </div>

        <div class="question active" id="q1">
            <div class="name-input-container">
                <input type="text" id="nameInput" class="name-input" placeholder="Enter Your Name <3" style="height: 40px;">
                <div id="nameError" style="color: red; font-size: 1.2rem; height: 0.5rem; margin-top: 0.1rem;"></div>
            </div>
            <h1 class="message" id="initialQuestion">Will you be my Valentine? 💖</h1>
            <div class="btn-container">
                <button class="btn yes-btn" onclick="nextQuestion(true, 1)">Yes :)</button>
                <div class="no-btn-container">
                    <button class="btn no-btn" onclick="handleNo()" onmouseover="dodgeNo(this)">No :(</button>
                </div>
            </div>
        </div>

        <div class="question" id="q2">
            <h1 class="message">Would you like to go on a date with me? 🌹</h1>
            <div class="btn-container">
                <button class="btn yes-btn" onclick="nextQuestion(true, 2)">Of course!</button>
                <div class="no-btn-container">
                    <button class="btn no-btn" onclick="handleNo()" onmouseover="dodgeNo(this)">No way!</button>
                </div>
            </div>
        </div>

        <div class="question" id="q3">
            <h1 class="message">Can I have a hug? 🤗</h1>
            <div class="btn-container">
                <button class="btn yes-btn" onclick="nextQuestion(true, 3)">Come here ✨</button>
                <div class="no-btn-container">
                    <button class="btn no-btn" onclick="handleNo()" onmouseover="dodgeNo(this)">Nope 👎</button>
                </div>
            </div>
        </div>

        <div class="question" id="final">
            <h1 class="message">You've made me the happiest person ever! ❤️</h1>
            <div class="floating-hearts"></div>
            <div class="btn-container">
                <button class="btn share-btn" onclick="shareExperience()">Share</button>
                <button class="btn reset-btn" onclick="resetQuestions()">Try Again</button>
            </div>
        </div>

        <div class="question" id="rejected">
            <h1 class="message" id="rejectionMessages">😢 But... but... please?</h1>
            <div class="btn-container">
                <button class="btn" onclick="resetQuestions()">Ok, let me try again</button>
            </div>
        </div>
        
    <footer style="text-align: center; margin-top: 20px; font-size: 0.8rem; color: #9b9696;">
    © 2025 Miruthunjaya - All Rights Reserved
    </footer>    
    </div>
    
    <script src="script.js"></script>
</body>

</html>
